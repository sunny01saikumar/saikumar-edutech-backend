server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: nexus-ai
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:${NEXUS_DB_PATH:./data}/nexusdb;AUTO_SERVER=TRUE}
    driverClassName: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:saikumarnexus46@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

nexus:
  mail:
    sender-name: ${SPRING_MAIL_SENDER_NAME:NEXUS AI Security Team}
    from-email: ${SPRING_MAIL_USERNAME:saikumarnexus46@gmail.com}
  ai:
    provider: ${AI_PROVIDER:ollama}
    groq:
      api-key: ${GROQ_API_KEY:}
      model: ${GROQ_MODEL:qwen-2.5-coder-32b}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-3-5-sonnet-20241022}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-1.5-pro}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:llama3}
    openai-compatible:
      base-url: ${OPENAI_COMPATIBLE_BASE_URL:http://localhost:1234/v1}
      api-key: ${OPENAI_COMPATIBLE_API_KEY:}
      model: ${OPENAI_COMPATIBLE_MODEL:local-model}

logging:
  level:
    com.nexus.ai: INFO
    org.springframework.web: INFO
