server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: nexus-ai
  datasource:
    url: jdbc:h2:file:./data/nexusdb;AUTO_SERVER=TRUE;AUTO_RECONNECT=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

nexus:
  ai:
    provider: ${AI_PROVIDER:ollama}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-3-5-sonnet-20241022}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-1.5-pro}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:llama3}
    openai-compatible:
      base-url: ${OPENAI_COMPATIBLE_BASE_URL:http://localhost:1234/v1}
      api-key: ${OPENAI_COMPATIBLE_API_KEY:}
      model: ${OPENAI_COMPATIBLE_MODEL:local-model}

logging:
  level:
    com.nexus.ai: INFO
    org.springframework.web: INFO
